[project]
name = "project-log-app"
version = "0.1.0"
description = "Local Git evidence collection for Project Log"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.141.1", "pydantic==2.13.5", "uvicorn==0.53.0",
  "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = ["httpx>=0.28,<1", "pytest>=8,<10", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/project_log"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
